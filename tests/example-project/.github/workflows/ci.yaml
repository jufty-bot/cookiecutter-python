# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: ci

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read
    id-token: write
    pull-requests: write

jobs:
    ci:
        name: ${{ matrix.name }}
        runs-on: ubuntu-24.04
        concurrency:
            group: ${{ github.workflow }}-${{ matrix.name }}-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: build
                      task: build
                    - name: check - format
                      task: check:format
                      annotations_ruff: true
                    - name: check - lint
                      task: check:lint
                      annotations_ruff: true
                    - name: check - types
                      task: check:types
                      annotations_mypy: true
                    - name: test - 3.10
                      task: test
                      python: "3.10"
                    - name: test - 3.11
                      task: test
                      python: "3.11"
                    - name: test - 3.12
                      task: test
                      python: "3.12"
                    - name: test - 3.13
                      task: test
                      python: "3.13"
                    - name: test - 3.14
                      task: test
                      python: "3.14"
                    - name: pre-commit
                      task: install
        steps:
            - name: ${{ matrix.name }}
              uses: juftin/actions/taskfile@v1
              with:
                  task: ${{ matrix.task }}
                  checkout: true
                  install: ${{ matrix.name != 'build' && matrix.name != 'pre-commit' }}
                  fetch-depth: ${{ matrix.name == 'pre-commit' && '0' || '1' }}
                  setup-uv: true
                  buildx: ${{ matrix.name == 'build' }}
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  annotations-ruff: ${{ matrix.annotations_ruff || false }}
                  annotations-mypy: ${{ matrix.annotations_mypy || false }}
                  annotations-pytest: ${{ matrix.python == '3.14' }}
                  pytest-coverage: ${{ matrix.python == '3.14' && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
              env:
                  UV_PYTHON: ${{ matrix.python || '' }}
            - name: pre-commit
              if: matrix.name == 'pre-commit' && github.event_name == 'pull_request'
              run: |
                  uv tool run --isolated \
                    --with pre-commit-uv \
                    pre-commit run \
                      --color always \
                      --from-ref ${{ github.event.pull_request.base.sha }} \
                      --to-ref ${{ github.event.pull_request.head.sha }}
