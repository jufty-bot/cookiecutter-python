_min_copier_version: "9.0.0"
_subdirectory: template
_templates_suffix: ""
_answers_file: .github/.copier-answers.yml
_envops:
  undefined: jinja2.StrictUndefined

project_name:
  type: str
  default: example-project
  validator: >-
    {% if not (project_name | regex_search('\\S')) %}Project name cannot be blank.{% endif %}
friendly_name:
  type: str
  default: "{{ project_name | lower | replace(' ', '-') }}"
  validator: >-
    {% if not (friendly_name | regex_search('^[a-z0-9]+([._-][a-z0-9]+)*$')) %}Use lowercase letters and digits, separated by periods, hyphens, or underscores.{% endif %}
repo_name:
  type: str
  default: "{{ friendly_name | lower | replace(' ', '-') }}"
  validator: >-
    {% if not (repo_name | regex_search('^[a-z][a-z0-9-]*$')) %}Use lowercase letters, digits, and hyphens; start with a letter.{% endif %}
project_slug:
  type: str
  default: "{{ friendly_name | lower | replace(' ', '_') | replace('-', '_') }}"
  validator: >-
    {% if not (project_slug | regex_search('^[a-z_][a-z0-9_]*$')) %}Use lowercase letters, digits, and underscores; do not start with a digit.{% endif %}
project_short_description:
  type: str
  default: Brief description of the project
version:
  type: str
  default: 0.1.0
full_name:
  type: str
  default: Justin Flannery
email:
  type: str
  default: juftin@juftin.com
github_username:
  type: str
  default: juftin
default_python_version:
  type: str
  choices: ["3.13", "3.12", "3.11", "3.10", "3.9"]
  default: "3.13"
default_branch:
  type: str
  choices: [main, master]
  default: main
license:
  type: str
  choices: [MIT, Apache-2.0, GPL-3.0, UNLICENSED]
  default: MIT
development_status:
  type: str
  choices:
    - "Development Status :: 1 - Planning"
    - "Development Status :: 2 - Pre-Alpha"
    - "Development Status :: 3 - Alpha"
    - "Development Status :: 4 - Beta"
    - "Development Status :: 5 - Production/Stable"
    - "Development Status :: 6 - Mature"
    - "Development Status :: 7 - Inactive"
  default: "Development Status :: 1 - Planning"
build_docker_image:
  type: bool
  default: false
publish_to_pypi:
  type: bool
  default: false
publish_to_docker_hub:
  type: bool
  default: false
logo_url:
  type: str
  default: https://raw.githubusercontent.com/juftin/juftin/main/static/juftin.png
favicon:
  type: str
  default: https://juftin.com/favicon.ico
